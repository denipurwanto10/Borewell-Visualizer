version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: borewell-postgres
    environment:
      POSTGRES_DB: borewell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d borewell"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - borewell-network

  # Optional: pgAdmin for database administration
  # Uncomment to enable
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: borewell-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   ports:
  #     - "127.0.0.1:5050:80"
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped
  #   networks:
  #     - borewell-network

volumes:
  postgres_data:
    driver: local
  # pgadmin_data:
  #   driver: local

networks:
  borewell-network:
    driver: bridge
    internal: false