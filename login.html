<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Login - Visualisasi Pipa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,body {margin:0;padding:0;height:1440px;width:900px;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;}
    .wrapper {height:100%;display:flex;align-items:center;justify-content:center;}
    .card {background:#ffffff;border-radius:12px;width:420px;padding:48px;box-shadow:0 12px 30px rgba(0,0,0,0.15);}
    h2 {margin-top:0;font-size:28px;color:#2d3748;text-align:center;}
    .form-group {margin-bottom:24px;}
    label {display:block;margin-bottom:8px;font-size:14px;color:#4a5568;}
    input {width:100%;padding:12px 14px;border:1px solid #cbd5e0;border-radius:8;font-size:16px;box-sizing:border-box;}
    button {width:100%;padding:12px;margin-top:8px;border:none;border-radius:8;font-size:16px;background:#2b6cb0;color:#ffffff;cursor:pointer;}
    button:hover {background:#3182ce;}
    .logo {text-align:center;margin-bottom:32px;}
    .logo img {max-height:48px;}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="logo"><img src="https://via.placeholder.com/120/2b6cb0/ffffff?text=LOGO" alt="Logo"></div>
    <h2>Masuk ke Akun</h2>
    <form>
      <div class="form-group"><label for="username">Username</label><input id="username" type="text" placeholder="username" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="password" required></div>
      <button tipe="submit">Masuk</button>
    </form>
  </div>
</div>
</body>
</html>
